  const toggleBtn = document.getElementById("callToggle");
  const enquiryBox = document.getElementById("enquiryBox");

    enquiryBox.style.display =
      enquiryBox.style.display === "block" ? "none" : "block";
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".floating-contact")) {
      enquiryBox.style.display = "none";
    }
  });
  toggleBtn.addEventListener("click", () => {
  enquiryBox.classList.toggle("show");
});
</script>

<script>
function loadComponent(id, file) {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', file, true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            document.getElementById(id).innerHTML = xhr.responseText;
        }
    };
    xhr.onerror = function() {
        console.error('Failed to load ' + file);
    };
    xhr.send();
}

loadComponent("header", "header.html");
loadComponent("footer", "footer.html");
</script>
